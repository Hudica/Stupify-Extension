<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Stupify</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --accent: #6c63ff;
      --accent-dark: #5a54d4;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #e0e0e5;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Setup screen ── */
    #apiSetup {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 14px;
      text-align: center;
    }

    #apiSetup .logo {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -1px;
    }

    #apiSetup h2 { font-size: 15px; font-weight: 700; }

    #apiSetup p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      max-width: 260px;
    }

    #apiSetup a { color: var(--accent); text-decoration: none; }
    #apiSetup a:hover { text-decoration: underline; }

    #apiKeyInput {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }

    #apiKeyInput:focus { border-color: var(--accent); }

    #saveKeyBtn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    #saveKeyBtn:hover { background: var(--accent-dark); }

    /* ── Main UI ── */
    #mainUI {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header .logo {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    #settingsBtn, #newSessionBtn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--muted);
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
    }

    #settingsBtn:hover, #newSessionBtn:hover { background: var(--bg); }

    #newSessionBtn { display: none; }

    #simplifyBtn {
      margin: 12px 16px 8px;
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #simplifyBtn:hover:not(:disabled) { background: var(--accent-dark); }

    #simplifyBtn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Scrollable area ── */
    #contentArea {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #emptyState {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      padding: 40px 16px;
      gap: 10px;
    }

    #emptyState .icon { font-size: 36px; }

    /* ── Output card ── */
    #output {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 13px;
    }

    #output h1 { font-size: 15px; margin: 14px 0 6px; }
    #output h2 { font-size: 14px; color: var(--accent); margin: 14px 0 5px; }
    #output h3 { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    #output p { margin: 4px 0; }
    #output br { display: block; margin: 2px 0; content: ''; }
    #output ul { padding-left: 18px; margin: 4px 0; }
    #output li { margin: 2px 0; }
    #output code {
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
    }

    /* ── Chat divider ── */
    #chatDivider {
      display: none;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 0;
      position: relative;
    }

    #chatDivider::before,
    #chatDivider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: var(--border);
    }

    #chatDivider::before { left: 0; }
    #chatDivider::after { right: 0; }

    /* ── Chat messages ── */
    #chat {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 88%;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .msg.user {
      background: var(--accent);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.model {
      background: var(--surface);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.model h2 { font-size: 13px; color: var(--accent); margin: 8px 0 3px; }
    .msg.model h3 { font-size: 12px; font-weight: 600; margin: 6px 0 3px; }
    .msg.model p { margin: 3px 0; }
    .msg.model ul { padding-left: 16px; margin: 3px 0; }
    .msg.model li { margin: 1px 0; }
    .msg.model code {
      background: var(--bg);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
    }

    /* ── Input area ── */
    #inputArea {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #userInput {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: var(--bg);
    }

    #userInput:focus { border-color: var(--accent); background: white; }
    #userInput:disabled { opacity: 0.5; }

    #sendBtn {
      padding: 8px 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #sendBtn:hover:not(:disabled) { background: var(--accent-dark); }
    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Setup screen -->
  <div id="apiSetup">
    <div class="logo">Stupify</div>
    <h2>Connect your free AI</h2>
    <p>
      Get a free Groq API key from
      <a href="https://console.groq.com/keys" target="_blank">console.groq.com</a>
      — no credit card needed. Paste it below to get started.
    </p>
    <input type="password" id="apiKeyInput" placeholder="AIza...">
    <button id="saveKeyBtn">Save & Continue</button>
  </div>

  <!-- Main UI -->
  <div id="mainUI">
    <header>
      <span class="logo">Stupify</span>
      <div style="display:flex;gap:4px">
        <button id="newSessionBtn" title="New session">✕</button>
        <button id="settingsBtn" title="Change API key">⚙</button>
      </div>
    </header>

    <button id="simplifyBtn">▶ Simplify this page</button>

    <div id="contentArea">
      <div id="emptyState">
        <div class="icon">📖</div>
        <p>Open any documentation page, then hit <strong>Simplify</strong> to break it down into plain English.</p>
      </div>
      <div id="output"></div>
      <div id="chatDivider">Follow-up questions</div>
      <div id="chat"></div>
    </div>

    <div id="inputArea">
      <input type="text" id="userInput" placeholder="Ask a follow-up..." disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script src="side_panel.js"></script>
</body>
</html>
